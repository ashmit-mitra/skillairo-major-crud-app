<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Full-Stack CRUD Manager</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; margin: 0; padding: 2rem; color: #1e293b; }
    .container { max-width: 850px; margin: auto; background: #fff; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; color: #0f172a; }
    form { display: flex; gap: 0.6rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    input, select, button { padding: 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    input { flex: 2; }
    button { background: #2563eb; color: #fff; border: none; cursor: pointer; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.8rem; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; }
    .btn-edit { background: #f59e0b; padding: 0.4rem 0.7rem; margin-right: 0.3rem; }
    .btn-del { background: #ef4444; padding: 0.4rem 0.7rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Project & Task Management System (CRUD)</h1>
    <form id="taskForm">
      <input type="hidden" id="taskId" />
      <input type="text" id="title" placeholder="Enter task or record title..." required />
      <select id="category">
        <option value="Development">Development</option>
        <option value="Design">Design</option>
        <option value="Testing">Testing</option>
      </select>
      <select id="status">
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>
      <button type="submit" id="submitBtn">Add Record</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Category</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="taskTable"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('taskForm');
    const table = document.getElementById('taskTable');

    async function loadTasks() {
      const res = await fetch('/api/tasks');
      const tasks = await res.json();
      table.innerHTML = tasks.map(t => `
        <tr>
          <td>${t.id}</td>
          <td>${t.title}</td>
          <td>${t.category}</td>
          <td>${t.status}</td>
          <td>
            <button class="btn-edit" onclick="editTask(${t.id}, '${t.title.replace(/'/g, "\\'")}', '${t.category}', '${t.status}')">Edit</button>
            <button class="btn-del" onclick="deleteTask(${t.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('taskId').value;
      const payload = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        status: document.getElementById('status').value
      };

      if (id) {
        await fetch(`/api/tasks/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      } else {
        await fetch('/api/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      }
      form.reset();
      document.getElementById('taskId').value = '';
      document.getElementById('submitBtn').textContent = 'Add Record';
      loadTasks();
    });

    function editTask(id, title, category, status) {
      document.getElementById('taskId').value = id;
      document.getElementById('title').value = title;
      document.getElementById('category').value = category;
      document.getElementById('status').value = status;
      document.getElementById('submitBtn').textContent = 'Update Record';
    }

    async function deleteTask(id) {
      await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
      loadTasks();
    }

    loadTasks();
  </script>
</body>
</html>
